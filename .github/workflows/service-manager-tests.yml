name: Stage 4-5 experimental regression (no hardware)
on:
  workflow_dispatch:
  push:
    paths:
      - "tihulu_runtime/**"
      - "tests/**"
      - "data/radio_text_networks.json"
      - "prototype/text_center_kit_preview.js"
      - "prototype/text_center_kit_mode.css"
      - "prototype/task_manager.html"
      - "prototype/local_ai_sources.html"
      - "prototype/ai_mode_profiles.html"
      - "prototype/lan_remote.html"
      - "prototype/lan_remote.js"
      - "docs/LAN_REMOTE_GATEWAY_EXPERIMENT.md"
      - "prototype/region_channel_setup.html"
      - "prototype/remote_control.html"
      - "data/region_channel_catalog.json"
      - "data/channel_frequency_presets.json"
      - ".github/workflows/service-manager-tests.yml"
  pull_request:
    paths:
      - "tihulu_runtime/**"
      - "tests/**"
      - "data/radio_text_networks.json"
      - "prototype/text_center_kit_preview.js"
      - "prototype/text_center_kit_mode.css"
      - "prototype/task_manager.html"
      - "prototype/local_ai_sources.html"
      - "prototype/ai_mode_profiles.html"
      - "prototype/lan_remote.html"
      - "prototype/lan_remote.js"
      - "docs/LAN_REMOTE_GATEWAY_EXPERIMENT.md"
      - "prototype/region_channel_setup.html"
      - "prototype/remote_control.html"
      - "data/region_channel_catalog.json"
      - "data/channel_frequency_presets.json"
      - ".github/workflows/service-manager-tests.yml"
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run full Python prototype unit test suite (synthetic, no Pi hardware)
        run: python -m unittest discover -s tests -v
      - name: Validate local AI HTML inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          for name in ("prototype/local_ai_sources.html",
                       "prototype/ai_mode_profiles.html"):
              source = Path(name).read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",
                                   source, flags=re.I | re.S)
              if not scripts:
                  raise SystemExit(f"No inline script in {name}")
              for script in scripts:
                  subprocess.run(["node", "--check"], input=script, text=True,
                                 check=True)
              print(f"JavaScript syntax OK: {name} ({len(scripts)} script(s))")
          PY
      - name: Check LAN remote browser JavaScript syntax
        run: node --check prototype/lan_remote.js

      - name: Check Text Center Kit browser JavaScript syntax
        run: node --check prototype/text_center_kit_preview.js
