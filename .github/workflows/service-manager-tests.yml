name: Stage 4 on-demand service manager
on:
  push:
    paths:
      - "tihulu_runtime/**"
      - "tests/**"
      - "data/radio_text_networks.json"
      - "prototype/task_manager.html"
      - ".github/workflows/service-manager-tests.yml"
  pull_request:
    paths:
      - "tihulu_runtime/**"
      - "tests/**"
      - "data/radio_text_networks.json"
      - "prototype/task_manager.html"
      - ".github/workflows/service-manager-tests.yml"
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate service policy, shared sessions and radio data catalog (no hardware)
        run: python -m unittest discover -s tests -v
